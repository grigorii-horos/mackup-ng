# Sample mackup-ng configuration file.
# Install it at ~/.config/mackup/config.toml

[storage]
# The one folder mackup backs your configuration files up into.
# A relative path is taken from your home directory; an absolute path is used
# as given. The folder containing it must already exist — mackup creates the
# backup folder itself, but refuses to invent a whole tree from a typo.
# There is no default: without this setting mackup has nowhere to work.
backup_dir = "Sync/Configs/Mackup"

[applications]
# Applications to sync. An empty list means every supported application.
# Run `mackup list` for the names.
sync = []

# Applications never to sync. Wins over `sync`.
ignore = ["ssh", "adium"]
